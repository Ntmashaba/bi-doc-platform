<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__ — SQL Agent Job Documentation</title>
<style>
:root{
  --bg:#F5F7FB; --panel:#FFFFFF; --panel2:#F1F4F9;
  --ink:#0F172A; --ink2:#334155; --ink3:#475569;
  --line:#CBD5E1; --line2:#E2E8F0;
  --accent:#4F46E5; --accentSoft:#EEF2FF;
  --src:#0F766E; --srcBg:#CCFBF1;
  --snk:#B45309; --snkBg:#FEF3C7;
  --ssas:#4338CA; --ssasBg:#E0E7FF;
  --ok:#047857; --okBg:#D1FAE5;
  --warn:#B45309; --warnBg:#FEF3C7;
  --bad:#BE123C; --badBg:#FFE4E6;
  --info:#334155; --infoBg:#E2E8F0;
  --mono:"Cascadia Code","Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:222px 1fr;min-height:100vh}
/* ---------------- nav rail ---------------- */
nav{background:#0F172A;padding:1.1rem .8rem;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-size:.68rem;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#94A3B8;margin-bottom:.35rem}
.doc-title{font-weight:600;font-size:1.02rem;line-height:1.25;margin-bottom:1.1rem;word-break:break-word;color:#fff}
.nav-btn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;font:inherit;color:#CBD5E1;padding:.42rem .55rem;border-radius:6px;cursor:pointer}
.nav-btn:hover{background:#1E293B;color:#fff}
.nav-btn.active{background:#1E293B;color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #818CF8}
.nav-btn:focus-visible{outline:2px solid #A5B4FC;outline-offset:1px}
.nav-btn .n{font-family:var(--mono);font-size:.68rem;color:inherit;opacity:.85}
/* ---------------- content ---------------- */
main{padding:1.4rem 2rem 4rem;max-width:1280px;min-width:0}
h1{font-size:1.45rem;font-weight:650;letter-spacing:-.01em;margin-bottom:.2rem}
h2{font-size:1.05rem;font-weight:650;margin:1.6rem 0 .6rem}
h3{font-size:.92rem;font-weight:650;margin:1rem 0 .4rem}
.sub{color:var(--ink2)}
.eyebrow{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1rem 1.1rem;margin-bottom:.8rem}
.note{border-left:3px solid var(--warn)}
.grid{display:grid;gap:.8rem}
.grid.c4{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.stat .big{font-size:1.6rem;font-weight:650;font-variant-numeric:tabular-nums}
.stat .lbl{font-size:.74rem;color:var(--ink2)}
/* summary cards that navigate to their section */
.card.stat.link{font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer;transition:border-color .12s}
.card.stat.link:hover{border-color:var(--accent)}
.card.stat.link .big{color:var(--accent)}
.nav-toggle{display:none}
table.t{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:.82rem}
table.t th{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:.5rem .7rem;border-bottom:1px solid var(--line);background:var(--panel2)}
table.t td{padding:.44rem .7rem;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tr.clickable{cursor:pointer}
table.t tr.clickable:hover td{background:var(--accentSoft)}
.badge{display:inline-block;font-family:var(--mono);font-size:.62rem;letter-spacing:.05em;padding:.12rem .45rem;border-radius:4px;white-space:nowrap;text-transform:uppercase}
.b-ok{background:var(--okBg);color:var(--ok)} .b-warn{background:var(--warnBg);color:var(--warn)}
.b-bad{background:var(--badBg);color:var(--bad)} .b-info{background:var(--infoBg);color:var(--info)}
.b-src{background:var(--srcBg);color:var(--src)} .b-snk{background:var(--snkBg);color:var(--snk)}
.b-ssas{background:var(--ssasBg);color:var(--ssas)}
.b-muted{background:var(--infoBg);color:var(--ink3)}
.ref{font-family:var(--mono);font-size:.78rem;background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:.05rem .3rem}
.xl{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-align:left}
.xl:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.search{width:280px;max-width:100%;padding:.42rem .6rem;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--panel);margin:0 0 .7rem}
.search:focus{outline:2px solid var(--accent);outline-offset:-1px}
select.picker{padding:.42rem .6rem;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--panel);margin:0 0 .9rem;max-width:100%}
.filter-row{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-bottom:.7rem}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:.22rem .7rem;font-size:.76rem;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.empty{border:1.5px dashed var(--line);border-radius:8px;padding:2rem;text-align:center;color:var(--ink2);background:var(--panel2)}
.empty b{color:var(--ink)}
pre.code{font-family:var(--mono);font-size:.76rem;line-height:1.55;background:#1C2528;color:#D8E2E0;border-radius:6px;padding:.7rem .85rem;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
details{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:.55rem}
details>summary{cursor:pointer;padding:.6rem .9rem;font-weight:600;list-style:none;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";color:var(--ink3);font-size:.8rem;transition:transform .12s}
details[open]>summary::before{transform:rotate(90deg)}
details>.body{padding:.2rem .9rem .9rem;border-top:1px solid var(--line2)}
.mut{color:var(--ink2);font-size:.8rem}
.kv{display:grid;grid-template-columns:170px 1fr;gap:.15rem .8rem;margin:.3rem 0}
.kv .k{color:var(--ink3);font-size:.74rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;padding-top:.1rem}
.pill-list{display:flex;flex-wrap:wrap;gap:.3rem}
/* execution flow graph */
.flow{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.8rem;overflow-x:auto;margin-bottom:.8rem}
.g-node rect{fill:var(--panel2);stroke:var(--line);rx:6}
.g-node text{font-family:var(--sans);font-size:12px;fill:var(--ink)}
.g-node .g-id{font-family:var(--mono);font-size:10px;fill:var(--ink3)}
.g-node.g-off rect{fill:var(--infoBg);stroke-dasharray:4 3}
.g-node.g-hot rect{stroke:var(--accent);stroke-width:2}
.g-edge{fill:none;stroke-width:1.6}
.g-edge.g-succ{stroke:var(--src)}
.g-edge.g-fail{stroke:var(--snk);stroke-dasharray:5 3}
.g-edge.g-def{opacity:.45}
.g-edge.g-bad{stroke:var(--bad);stroke-dasharray:2 3}
.g-term rect{rx:10}
.g-term text{font-family:var(--mono);font-size:10px;fill:#fff}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.76rem;color:var(--ink2);margin:.4rem 0 .8rem}
.legend span{display:flex;align-items:center;gap:.35rem}
.sw{width:16px;height:0;border-top:2.4px solid;display:inline-block}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav{position:static;height:auto}
  .nav-btn{display:none}
  nav.open .nav-btn{display:flex;margin-top:.2rem}
  .nav-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;
    border:0;background:#1E293B;color:#fff;font:inherit;font-weight:600;padding:.5rem .55rem;
    border-radius:6px;cursor:pointer;margin-top:.5rem}
  main{padding:1rem}
}
@media print{nav{display:none}.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="layout">
  <nav id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<script>
const DATA = /*__DATA__*/null;
/* ============================================================ helpers */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => (n ?? 0).toLocaleString();
const JOBS = DATA.jobs || [];
const JIDX = {}; JOBS.forEach(j => JIDX[j.identity] = j);
const GRAPHS = DATA.executionGraphs || {};
const PROC = DATA.processing || {targets:[], coincidence:[], operations:[]};
const ISSUES = DATA.issues || [];
const WARNINGS = DATA.warnings || [];
/* Element ids come from a lookup, so any name (quotes, backslashes, Unicode)
   maps to a safe, unique id. Names are never interpolated into script. */
const _ids = new Map();
const slug = s => { s = String(s); if(!_ids.has(s)) _ids.set(s, "i"+_ids.size); return _ids.get(s); };
const go = (kind, arg, label) => `<button class="xl" data-go="${kind}" data-arg="${esc(arg)}">${label}</button>`;
function flash(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.scrollIntoView({block:"center"});
  if(el.tagName==="DETAILS") el.open = true;
  el.style.boxShadow = "0 0 0 3px var(--ssas)";
  setTimeout(()=>{ el.style.boxShadow=""; }, 1600);
}
let SEL_JOB = JOBS.length ? JOBS[0].identity : null;
let ISSUE_FILTER = "all";
const GO = {
  section: openSection,
  job: id => { SEL_JOB = id; openSection("job"); requestAnimationFrame(()=>flash("jobcard")); },
  jobstep: arg => { const [id, node] = arg.split("#"); SEL_JOB = id; openSection("job");
    requestAnimationFrame(()=>flash("step-"+slug(id+"#"+node))); },
  issuefilter: sev => { ISSUE_FILTER = sev; openSection("issues"); },
};
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-go]");
  if(b && GO[b.dataset.go]) GO[b.dataset.go](b.dataset.arg);
});
const jobLink = id => JIDX[id] ? go("job", id, esc(JIDX[id].name || id)) : esc(id);
const yesNo = v => v === null || v === undefined ? '<span class="mut">—</span>'
  : (v ? '<span class="badge b-ok">yes</span>' : '<span class="badge b-muted">no</span>');
const enabledBadge = v => v === null || v === undefined ? '<span class="mut">not scripted</span>'
  : (v ? '<span class="badge b-ok">enabled</span>' : '<span class="badge b-warn">disabled</span>');
const sevBadge = s => ({info:'b-info',warning:'b-warn',alert:'b-bad'}[s]||'b-info');
const subBadge = s => {
  const sub = (s||"TSQL").toUpperCase();
  const cls = sub.startsWith("ANALYSIS") ? "b-ssas" : (sub==="TSQL" ? "b-src" : "b-snk");
  return `<span class="badge ${cls}">${esc(sub)}</span>`;
};

/* ============================================================ sections */
const SECTIONS = [
  {id:"overview",   label:"Overview"},
  {id:"jobs",       label:"Jobs",          count:()=>JOBS.length},
  {id:"job",        label:"Selected job"},
  {id:"processing", label:"Processing",    count:()=>PROC.targets.length||null},
  {id:"schedules",  label:"Schedules"},
  {id:"issues",     label:"Review issues", count:()=>ISSUES.length||null},
  {id:"coverage",   label:"Coverage"},
  {id:"jobmeta",    label:"Properties &amp; objects"},
];

function buildNav(){
  let html = `<div class="brand">SQL Agent Doc Gen</div><div class="doc-title">${esc(DATA.title)}</div>`;
  html += `<button class="nav-toggle" id="navtoggle" aria-expanded="false"><span class="nt-label">Overview</span><span aria-hidden="true">▾</span></button>`;
  for(const sec of SECTIONS){
    const n = sec.count ? sec.count() : null;
    html += `<button class="nav-btn" id="sec-${sec.id}" data-go="section" data-arg="${sec.id}">${sec.label}${n?`<span class="n">${n}</span>`:""}</button>`;
  }
  const nav = document.getElementById("nav");
  nav.innerHTML = html;
  document.getElementById("navtoggle").addEventListener("click", () => {
    const open = nav.classList.toggle("open");
    document.getElementById("navtoggle").setAttribute("aria-expanded", String(open));
  });
}
let CURRENT = null;
function openSection(id){
  const sec = SECTIONS.find(s=>s.id===id);
  if(!sec) return;
  document.querySelectorAll(".nav-btn").forEach(b=>{
    const on = b.id==="sec-"+id;
    b.classList.toggle("active", on);
    if(on) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  const toggle = document.getElementById("navtoggle");
  if(toggle){
    toggle.querySelector(".nt-label").textContent = sec.label;
    toggle.setAttribute("aria-expanded", "false");
    document.getElementById("nav").classList.remove("open");
  }
  document.getElementById("main").innerHTML = RENDER[id]();
  CURRENT = id;
  window.scrollTo(0,0);
}

/* ============================================================ overview */
function secOverview(){
  const steps = JOBS.reduce((n,j)=>n+(j.steps||[]).length,0);
  const schedNames = new Set();
  JOBS.forEach(j => (j.schedules||[]).forEach(s => schedNames.add((s.uid||"")+"|"+(s.id||"")+"|"+(s.name||""))));
  const ssasOps = (PROC.operations||[]).length;
  const bySev = {info:0, warning:0, alert:0};
  ISSUES.forEach(i => bySev[i.severity] = (bySev[i.severity]||0)+1);
  const cov = DATA.coverage || {};
  const top = [...ISSUES].sort((a,b)=>({alert:0,warning:1,info:2}[a.severity]-{alert:0,warning:1,info:2}[b.severity])).slice(0,8);
  const stat = (arg, big, lbl) =>
    `<button class="card stat link" data-go="section" data-arg="${arg}"><div class="big">${big}</div><div class="lbl">${lbl}</div></button>`;
  return `
  <h1>${esc(DATA.title)}</h1>
  <p class="sub">Static analysis of scripted SQL Server Agent jobs. No server was contacted;
     everything here is derived from the scripts. Generation details are in Coverage.</p>
  <div class="card note">
    <b>How to read this document.</b>
    Findings are <i>evidence, not instructions</i>: each review issue states what the scripts say,
    never what to change. Schedules are reported as <i>coinciding</i> — the scripts contain start
    times but no durations, so a coincidence does not show the jobs running at the same time. Where a script could not be
    parsed completely, the Coverage section says so; nothing is silently dropped.
  </div>
  ${WARNINGS.length ? `<h2>Warnings</h2><div class="card"><ul>${WARNINGS.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}
  ${top.length ? `<h2>Review first — most severe findings</h2><div class="card">
    <table class="t"><thead><tr><th>severity</th><th>finding</th><th>job</th></tr></thead><tbody>
    ${top.map(i=>`<tr><td><span class="badge ${sevBadge(i.severity)}">${esc(i.severity)}</span></td>
      <td>${esc(i.message)}</td><td>${i.job?jobLink(jobIdByName(i.job)):""}</td></tr>`).join("")}
    </tbody></table>
    <p style="margin-top:.5rem">${go("section","issues","Open all review issues →")}</p></div>` : ""}
  <h2>Document summary</h2>
  <div class="grid c4">
    ${stat("jobs", num(JOBS.length), "jobs scripted")}
    ${stat("jobs", num(steps), "steps")}
    ${stat("schedules", num(schedNames.size), `schedules (${num((DATA.sharedSchedules||[]).length)} shared)`)}
    ${stat("processing", num(ssasOps), "SSAS operations")}
    ${stat("jobmeta", num((DATA.entities||[]).length), "referenced objects")}
    ${stat("issues", num(ISSUES.length), `review issues <span class="mut">${bySev.alert||0} alert · ${bySev.warning||0} warning · ${bySev.info||0} info</span>`)}
    ${stat("coverage", num(cov.unrecognisedStatements||0), "unrecognised statements")}
    ${stat("coverage", num(DATA.redactions||0), "secret values withheld")}
  </div>`;
}
function jobIdByName(n){ const j = JOBS.find(j=>j.name===n); return j?j.identity:""; }

/* ============================================================ jobs */
function secJobs(){
  return `
  <h1>Jobs</h1>
  <p class="sub">${num(JOBS.length)} job(s) in the scripted input. Click a row for the job detail view.</p>
  <input class="search" id="jobsearch" placeholder="Filter jobs…" aria-label="Filter jobs">
  <table class="t" id="jobtable"><thead><tr>
    <th>job</th><th>state</th><th>steps</th><th>schedules</th><th>owner</th><th>subsystems</th></tr></thead>
  <tbody>${JOBS.map(j=>{
    const subs = [...new Set((j.steps||[]).map(s=>(s.subsystem||"TSQL").toUpperCase()))];
    return `<tr class="clickable" data-go="job" data-arg="${esc(j.identity)}"
      data-s="${esc((j.name+" "+(j.owner||"")+" "+subs.join(" ")).toLowerCase())}">
      <td><b>${esc(j.name||j.identity)}</b>${j.enabled===0?' <span class="badge b-warn">disabled</span>':""}</td>
      <td>${enabledBadge(j.enabled)}</td>
      <td>${num((j.steps||[]).length)}</td>
      <td>${(j.schedules||[]).map(s=>esc(s.name||"(unnamed)")).join(", ")||'<span class="mut">—</span>'}</td>
      <td>${esc(j.owner||"")||'<span class="mut">—</span>'}</td>
      <td>${subs.map(s=>subBadge(s)).join(" ")}</td></tr>`;
  }).join("")}</tbody></table>`;
}
/* Delegated listeners: innerHTML-injected script tags would never run. */
document.addEventListener("input", ev => {
  if(ev.target.id === "jobsearch"){
    const q = ev.target.value.toLowerCase();
    document.querySelectorAll("#jobtable tbody tr").forEach(tr=>{
      tr.style.display = tr.dataset.s.includes(q)?"":"none"; });
  }
  if(ev.target.id === "issuesearch"){
    const q = ev.target.value.toLowerCase();
    document.querySelectorAll("#issuetable tbody tr").forEach(tr=>{
      tr.style.display = tr.dataset.s.includes(q)?"":"none"; });
  }
});
document.addEventListener("change", ev => {
  if(ev.target.id === "jobpicker"){ SEL_JOB = ev.target.value; openSection("job"); }
});
/* ============================================================ job detail */
const trunc = (s,n) => { s=String(s??""); return s.length>n ? s.slice(0,n-1)+"…" : s; };
const ACTION_TXT = {1:"quit (success)",2:"quit (failure)",3:"go to next step",4:"go to step"};
function actionTxt(a, stepId, defaulted){
  if(a===null||a===undefined) return "";
  const t = a===4 ? `go to step ${stepId}` : ACTION_TXT[a] || `action ${a}`;
  return esc(t) + (defaulted ? ' <span class="mut">(default — not scripted)</span>' : "");
}

function flowSVG(g, identity){
  const nodes = g.nodes || [];
  if(!nodes.length) return "";
  const rowH = 50, NW = 300, NX = 46, NH = 34;
  const termX = NX + NW + 110, termW = 132;
  const pos = {}; nodes.forEach((n,i)=>pos[n.id]=i);
  const cy = i => 26 + i*rowH + NH/2;
  const top = i => 26 + i*rowH;
  let rightChan = 0, leftChan = 0;
  const unreachable = new Set((g.unreachable||[]).map(u=>u.id));
  const inLoop = new Set(); (g.loops||[]).forEach(l=>l.forEach(n=>inLoop.add(n)));
  let paths = "";
  const chanGap = 9;
  for(const e of (g.edges||[])){
    const i = pos[e.from]; if(i===undefined) continue;
    const cls = "g-edge " + (e.unresolved ? "g-bad" : (e.on==="success"?"g-succ":"g-fail")) + (e.defaulted?" g-def":"");
    const y1 = cy(i) + (e.on==="success" ? -6 : 6);
    const marker = e.unresolved ? "url(#arrBad)" : (e.on==="success" ? "url(#arrOk)" : "url(#arrWarn)");
    if(e.unresolved || e.to===null){
      const ch = NX+NW+18+(rightChan++)*chanGap;
      paths += `<path class="${cls}" d="M ${NX+NW} ${y1} H ${ch}"/>`;
      paths += `<text x="${ch+6}" y="${y1+4}" font-size="12" fill="var(--bad)">? step ${esc(e.gotoStepId)}</text>`;
      continue;
    }
    if(e.to==="quit-success" || e.to==="quit-failure"){
      const ty = e.to==="quit-success" ? 26+13 : 26+13+32;
      const ch = NX+NW+18+(rightChan++)*chanGap;
      paths += `<path class="${cls}" marker-end="${marker}" d="M ${NX+NW} ${y1} H ${ch} V ${ty} H ${termX-4}"/>`;
      continue;
    }
    const j = pos[e.to]; if(j===undefined) continue;
    const y2 = cy(j) + (e.on==="success" ? -6 : 6);
    if(j > i){
      const ch = NX+NW+18+(rightChan++)*chanGap;
      paths += `<path class="${cls}" marker-end="${marker}" d="M ${NX+NW} ${y1} H ${ch} V ${y2} H ${NX+NW+4}"/>`;
    } else {
      const ch = NX-14-(leftChan++)*chanGap;
      paths += `<path class="${cls}" marker-end="${marker}" d="M ${NX} ${y1} H ${ch} V ${y2} H ${NX-4}"/>`;
    }
  }
  const H = Math.max(26 + nodes.length*rowH, 90) + 8;
  const W = termX + termW + 16;
  let out = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Execution flow graph">
  <defs>
    <marker id="arrOk" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--src)"/></marker>
    <marker id="arrWarn" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--snk)"/></marker>
    <marker id="arrBad" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--bad)"/></marker>
  </defs>
  <g class="g-term"><rect x="${termX}" y="26" width="${termW}" height="26" fill="var(--src)"/><text x="${termX+termW/2}" y="43" text-anchor="middle">quit · success</text></g>
  <g class="g-term"><rect x="${termX}" y="${58}" width="${termW}" height="26" fill="var(--snk)"/><text x="${termX+termW/2}" y="75" text-anchor="middle">quit · failure</text></g>
  ${paths}`;
  nodes.forEach((n,i)=>{
    const off = unreachable.has(n.id), start = g.start===n.id;
    out += `<g class="g-node${off?" g-off":""}" data-go="jobstep" data-arg="${esc(identity+"#"+n.id)}" style="cursor:pointer">
      <title>${esc(n.name)} — click to open the step detail</title>
      <rect x="${NX}" y="${top(i)}" width="${NW}" height="${NH}" rx="6"/>
      <text class="g-id" x="${NX+8}" y="${top(i)+13}">${esc(n.stepId!==null&&n.stepId!==undefined?"step "+n.stepId:"step?")}${start?" · start":""}${off?" · not reached from start":""}</text>
      <text x="${NX+8}" y="${top(i)+28}">${esc(trunc(n.name,36))}${inLoop.has(n.id)?" ↺":""}</text>
    </g>`;
  });
  return out + "</svg>";
}

function secJob(){
  if(!JOBS.length) return `<h1>Selected job</h1><div class="empty"><b>No jobs in this input.</b></div>`;
  const j = JIDX[SEL_JOB] || JOBS[0];
  SEL_JOB = j.identity;
  const g = GRAPHS[j.identity] || {nodes:[],edges:[]};
  const picker = `<select class="picker" id="jobpicker" aria-label="Choose a job">${JOBS.map(x=>
    `<option value="${esc(x.identity)}"${x.identity===j.identity?" selected":""}>${esc(x.name||x.identity)}</option>`).join("")}</select>`;
  const meta = `<div class="card" id="jobcard">
    <h2 style="margin-top:0">${esc(j.name||j.identity)}</h2>
    <div class="kv">
      <div class="k">state</div><div>${enabledBadge(j.enabled)} ${j.recreatePreamble?'<span class="badge b-info">recreate preamble</span>':""}</div>
      <div class="k">category</div><div>${esc(j.category||"")||'<span class="mut">—</span>'}</div>
      <div class="k">owner</div><div>${esc(j.owner||"")||'<span class="mut">not scripted — likely a partial script</span>'}</div>
      <div class="k">registered on</div><div>${(j.registeredOn||[]).map(s=>`<span class="ref">${esc(s)}</span>`).join(" ")||'<span class="mut">—</span>'}</div>
      <div class="k">schedules</div><div>${(j.schedules||[]).map(s=>esc(s.summary||s.name||"")).join("; ")||'<span class="mut">none scripted</span>'}</div>
      ${j.description?`<div class="k">description</div><div>${esc(j.description)}</div>`:""}
    </div></div>`;
  const legend = `<div class="legend">
    <span><i class="sw" style="border-color:var(--src)"></i>on success</span>
    <span><i class="sw" style="border-color:var(--snk);border-top-style:dashed"></i>on failure</span>
    <span><i class="sw" style="border-color:var(--ink3);opacity:.45"></i>assumed default (action not scripted)</span>
    <span><i class="sw" style="border-color:var(--bad);border-top-style:dotted"></i>goto target not in script</span>
  </div>`;
  const notes = [];
  if(g.startNote) notes.push(`Start step not determined: ${esc(g.startNote)} — reachability is not assessed for this job.`);
  if((g.unreachable||[]).length) notes.push(`Not reachable from the scripted start step: ${g.unreachable.map(u=>esc(u.name||u.id)).join(", ")}.`);
  if((g.loops||[]).length) notes.push(`The flow loops back (${g.loops.map(l=>l.map(id=>esc(trunc((g.nodes.find(n=>n.id===id)||{}).name||id,18))).join(" → ")).join("; ")}); the exit condition lives in the step logic, not the flow.`);
  const steps = (j.steps||[]).map((s,i)=>{
    const nid = g.nodes && g.nodes[i] ? g.nodes[i].id : String(i);
    const ops = s.operations||[];
    const sql = s.sql;
    const badges = [
      subBadge(s.subsystem),
      s.retryAttempts ? `<span class="badge b-info">retry ×${num(s.retryAttempts)}${s.retryIntervalMinutes?` / ${num(s.retryIntervalMinutes)} min`:""}</span>` : "",
      s.proxy ? `<span class="badge b-info">proxy: ${esc(s.proxy)}</span>` : "",
      s.parallel ? `<span class="badge b-ssas">parallel${s.maxParallelism?" ×"+num(s.maxParallelism):""}</span>` : "",
      s.transaction===true ? `<span class="badge b-ssas">transaction</span>` : "",
    ].filter(Boolean).join(" ");
    const kv = `<div class="kv">
      ${s.server?`<div class="k">ssas server</div><div><span class="ref">${esc(s.server)}</span></div>`:""}
      ${s.database?`<div class="k">database</div><div><span class="ref">${esc(s.database)}</span></div>`:""}
      <div class="k">on success</div><div>${actionTxt(s.onSuccessAction,s.onSuccessStepId,s.onSuccessAction===null||s.onSuccessAction===undefined)||'<span class="mut">quit (success) — default</span>'}</div>
      <div class="k">on failure</div><div>${actionTxt(s.onFailAction,s.onFailStepId,s.onFailAction===null||s.onFailAction===undefined)||'<span class="mut">quit (failure) — default</span>'}</div>
      ${s.errorConfiguration?`<div class="k">error config</div><div>${esc(s.errorConfiguration)}</div>`:""}
    </div>`;
    let body = kv;
    if(s.parseError) body += `<p class="badge b-warn">command not parsed: ${esc(s.parseError)}</p>`;
    if(ops.length){
      body += `<table class="t"><thead><tr><th>source</th><th>operation</th><th>type</th><th>object</th><th>reads</th></tr></thead><tbody>
        ${ops.map(o=>`<tr><td>${esc(o.source||"")}</td><td><b>${esc(o.kind||"")}</b></td>
          <td>${esc(o.verb||"")||'<span class="mut">—</span>'}</td>
          <td>${o.object?`<span class="ref">${esc(o.object)}</span>`:'<span class="mut">—</span>'}</td>
          <td>${(o.reads||[]).map(r=>esc(r)).join(", ")||'<span class="mut">—</span>'}</td></tr>`).join("")}
      </tbody></table>`;
    }
    if(sql){
      body += `<div class="kv">
        <div class="k">reads</div><div>${(sql.reads||[]).map(t=>`<span class="badge b-src" style="text-transform:none">${esc(t)}</span>`).join(" ")||'<span class="mut">—</span>'}</div>
        <div class="k">writes</div><div>${(sql.writes||[]).map(t=>`<span class="badge b-snk" style="text-transform:none">${esc(t)}</span>`).join(" ")||'<span class="mut">—</span>'}</div>
        <div class="k">calls</div><div>${(sql.procs||[]).map(t=>`<span class="ref">${esc(t)}</span>`).join(" ")||'<span class="mut">—</span>'}</div>
      </div>`;
    }
    if(s.commandKind && s.commandKind!=="literal")
      body += `<p class="mut">Command is ${esc(s.commandKind)} — built at runtime, carried as ${esc(s.command)}. It is counted in coverage, not analysed.</p>`;
    if(s.command && s.commandKind==="literal")
      body += `<details><summary>Raw command</summary><div class="body"><pre class="code">${esc(s.command)}</pre></div></details>`;
    return `<details class="card" id="step-${slug(j.identity+"#"+nid)}" style="padding:0">
      <summary><span class="ref">${s.id!==null&&s.id!==undefined?"#"+esc(s.id):"·"}</span> ${esc(s.name||"(unnamed step)")} ${badges}</summary>
      <div class="body">${body}</div></details>`;
  }).join("");
  return `<h1>Selected job</h1>${picker}${meta}
    <h2>Execution flow</h2>${legend}
    <div class="flow">${flowSVG(g, j.identity)||'<span class="mut">No steps scripted.</span>'}</div>
    ${notes.length?`<div class="card note">${notes.map(n=>`<p>${n}</p>`).join("")}</div>`:""}
    <h2>Steps</h2>${steps || '<div class="empty"><b>No steps scripted for this job.</b></div>'}`;
}
/* ============================================================ processing */
function secProcessing(){
  const tgts = PROC.targets || [];
  const coinc = PROC.coincidence || [];
  let out = `<h1>Processing</h1>
  <p class="sub">The SSAS processing sequence across jobs, grouped by target database.
  This is the <i>processing</i> view — which objects each step processes — separate from the
  execution flow inside each job.</p>`;
  if(coinc.length){
    out += `<h2>Coincident start times</h2><div class="card note">
      <p>These jobs process the same database and their schedules <b>coincide</b>. The scripts
      contain start times but no durations — a coincidence does not show the jobs running at the same time.</p>
      <table class="t"><thead><tr><th>database</th><th>server</th><th>jobs</th><th>schedule</th></tr></thead><tbody>
      ${coinc.map(c=>`<tr><td><span class="ref">${esc(c.database)}</span></td><td>${esc(c.server)}</td>
        <td>${c.jobs.map(n=>jobLink(jobIdByName(n))).join(", ")}</td>
        <td>${esc(c.schedule||"")||'<span class="mut">—</span>'}</td></tr>`).join("")}
      </tbody></table></div>`;
  }
  if(!tgts.length){
    out += `<div class="empty"><b>No SSAS operations found.</b><br>No ANALYSISCOMMAND or ANALYSISQUERY steps carried a parseable command.</div>`;
    return out;
  }
  out += tgts.map(t=>`
    <div class="card">
      <h2 style="margin-top:0"><span class="ref">${esc(t.server)}</span> / <span class="ref">${esc(t.database)}</span></h2>
      <p class="mut">processed by ${t.jobs.map(n=>jobLink(jobIdByName(n))).join(", ")}</p>
      <table class="t"><thead><tr><th>job</th><th>step</th><th>operation</th><th>type</th><th>object</th><th>flags</th></tr></thead><tbody>
      ${t.operations.map(o=>`<tr>
        <td>${jobLink(o.jobIdentity)}</td><td>${esc(o.step||"")}</td>
        <td><b>${esc(o.kind||"")}</b></td><td>${esc(o.verb||"")||'<span class="mut">—</span>'}</td>
        <td>${o.object?`<span class="ref">${esc(o.object)}</span>`:'<span class="mut">—</span>'}</td>
        <td>${[o.parallel?'<span class="badge b-ssas">parallel</span>':"",
               o.transaction===true?'<span class="badge b-ssas">transaction</span>':"",
               o.partitionGranular?'<span class="badge b-src">partition scope</span>':""].filter(Boolean).join(" ")}</td>
      </tr>`).join("")}</tbody></table>
    </div>`).join("");
  return out;
}

/* ============================================================ schedules */
function secSchedules(){
  const rows = [];
  JOBS.forEach(j => (j.schedules||[]).forEach(s => rows.push({job:j, s})));
  const shared = DATA.sharedSchedules || [];
  const coinc = PROC.coincidence || [];
  const coincIssues = ISSUES.filter(i=>i.code==="schedules-coincide");
  return `<h1>Schedules</h1>
  <p class="sub">Decoded from the msdb frequency model. Where start times coincide it is labelled
  as such — scripts carry no durations, so a coincidence does not show the jobs running at the same time.</p>
  ${rows.length ? `<div class="card"><table class="t"><thead><tr>
    <th>job</th><th>schedule</th><th>state</th><th>frequency</th><th>when</th><th>active window</th></tr></thead><tbody>
    ${rows.map(r=>`<tr>
      <td>${jobLink(r.job.identity)}</td><td>${esc(r.s.name||"(unnamed)")}</td>
      <td>${enabledBadge(r.s.enabled)}</td>
      <td>${esc(r.s.frequency||"")}</td><td>${esc(r.s.subday||"")||'<span class="mut">—</span>'}</td>
      <td class="mut">${esc(r.s.activeStartDate||"")} → ${r.s.activeEndDate && r.s.activeEndDate!=="9999-12-31" ? esc(r.s.activeEndDate) : "open"}</td>
    </tr>`).join("")}</tbody></table></div>`
  : `<div class="empty"><b>No schedules scripted.</b></div>`}
  ${shared.length ? `<h2>Shared schedules</h2><div class="card"><table class="t"><thead><tr>
    <th>schedule</th><th>summary</th><th>used by</th></tr></thead><tbody>
    ${shared.map(s=>`<tr><td>${esc(s.name||"(unnamed)")}</td><td>${esc(s.summary||"")}</td>
      <td>${(s.attachedJobs||[]).map(n=>jobLink(jobIdByName(n))).join(", ")||'<span class="mut">—</span>'}</td></tr>`).join("")}
    </tbody></table></div>` : ""}
  ${coincIssues.length || coinc.length ? `<h2>Coincidence view <span class="badge b-info">labelled</span></h2>
    <div class="card note">
    ${coincIssues.map(i=>`<p>${esc(i.message)}</p>`).join("")}
    ${coinc.map(c=>`<p>Processing coincidence on <span class="ref">${esc(c.database)}</span>: ${esc(c.jobs.join(", "))}${c.schedule?` — ${esc(c.schedule)}`:""}.</p>`).join("")}
    <p class="mut">Coincident start times only. The scripts contain no durations, so nothing here
    shows two jobs running at the same time.</p></div>` : ""}`;
}

/* ============================================================ issues */
function secIssues(){
  const sevs = ["all","alert","warning","info"];
  const shown = ISSUES.filter(i => ISSUE_FILTER==="all" || i.severity===ISSUE_FILTER);
  return `<h1>Review issues</h1>
  <p class="sub">Findings are evidence, not instructions. Each states what the scripts say;
  what to change — if anything — is a decision for the owner of the jobs.</p>
  <div class="filter-row">${sevs.map(s=>`<button class="chip${ISSUE_FILTER===s?" on":""}" data-go="issuefilter" data-arg="${s}">${s}${s==="all"?` (${ISSUES.length})`:` (${ISSUES.filter(i=>i.severity===s).length})`}</button>`).join("")}</div>
  ${shown.length ? `<table class="t" id="issuetable"><thead><tr>
    <th>severity</th><th>code</th><th>finding</th><th>job</th><th>step</th><th>evidence</th></tr></thead><tbody>
    ${shown.map(i=>`<tr data-s="${esc((i.message+" "+(i.job||"")+" "+(i.step||"")+" "+i.code).toLowerCase())}">
      <td><span class="badge ${sevBadge(i.severity)}">${esc(i.severity)}</span></td>
      <td><span class="ref">${esc(i.code)}</span></td>
      <td>${esc(i.message)}</td>
      <td>${i.job?jobLink(jobIdByName(i.job)):""}</td><td>${esc(i.step||"")}</td>
      <td class="mut">${esc(i.evidence||"")}</td></tr>`).join("")}</tbody></table>`
  : `<div class="empty"><b>Nothing flagged${ISSUE_FILTER!=="all"?" at this severity":""}.</b></div>`}
  ${WARNINGS.length ? `<h2>Parse warnings</h2><div class="card"><ul>${WARNINGS.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}`;
}

/* ============================================================ coverage */
function secCoverage(){
  const cov = DATA.coverage || {};
  const rows = [
    ["input files analysed", cov.inputFiles],
    ["files skipped", (cov.skippedFiles||[]).length],
    ["unrecognised EXEC statements", cov.unrecognisedStatements],
    ["steps not parsed (command built at runtime)", cov.unparsedSteps],
    ["unknown operations", cov.unknownOperations],
    ["secret values withheld (redacted)", DATA.redactions||0],
  ];
  return `<h1>Coverage</h1>
  <p class="sub">How completely the scripts were understood. Anything unrecognised is counted
  here and surfaced as a warning — never silently dropped.</p>
  <div class="card"><table class="t"><tbody>
    ${rows.map(r=>`<tr><td>${esc(r[0])}</td><td style="text-align:right"><b>${num(r[1]||0)}</b></td></tr>`).join("")}
  </tbody></table></div>
  ${(cov.skippedFiles||[]).length ? `<h2>Skipped files</h2><div class="card"><ul>${cov.skippedFiles.map(f=>`<li><span class="ref">${esc(f)}</span></li>`).join("")}</ul></div>` : ""}
  ${WARNINGS.length ? `<h2>Warnings</h2><div class="card"><ul>${WARNINGS.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}
  <h2>Document details</h2>
  <div class="card"><div class="kv">
    <div class="k">title</div><div>${esc(DATA.title)}</div>
    <div class="k">generated</div><div>${esc(DATA.generated||"")}</div>
    <div class="k">generator</div><div>${esc(DATA.generator||"sqlagent-doc-gen")} ${esc(DATA.engineVersion||"")}</div>
    ${(DATA.producer||{}).bidoc ? `<div class="k">platform</div><div>bi-doc-generator ${esc(DATA.producer.bidoc)}</div>` : ""}
  </div></div>`;
}

/* ============================================================ job details */
function secJobMeta(){
  const ents = DATA.entities || [];
  return `<h1>Properties &amp; objects</h1>
  ${JOBS.map(j=>`<div class="card">
    <h2 style="margin-top:0">${esc(j.name||j.identity)}</h2>
    <div class="kv">
      <div class="k">identity</div><div><span class="ref">${esc(j.identity)}</span></div>
      ${j.guid?`<div class="k">guid</div><div><span class="ref">${esc(j.guid)}</span></div>`:""}
      <div class="k">state</div><div>${enabledBadge(j.enabled)}</div>
      <div class="k">start step</div><div>${j.startStepId!==null&&j.startStepId!==undefined?esc(j.startStepId):'<span class="mut">step ID 1 (msdb default)</span>'}</div>
      <div class="k">notify levels</div><div class="mut">email ${j.notifyLevelEmail??"—"} · netsend ${j.notifyLevelNetsend??"—"} · page ${j.notifyLevelPage??"—"} · event log ${j.notifyLevelEventlog??"—"}${j.notifyEmailOperator?` · operator ${esc(j.notifyEmailOperator)}`:""}</div>
      <div class="k">delete level</div><div>${j.deleteLevel??'<span class="mut">—</span>'}</div>
      <div class="k">originating server</div><div>${esc(j.originatingServer||"")||'<span class="mut">—</span>'}</div>
      <div class="k">source file</div><div><span class="ref">${esc(j.sourceFile||"")}</span></div>
    </div></div>`).join("")}
  <h2>Referenced objects <span class="mut">(normalized model)</span></h2>
  ${ents.length ? `<div class="card"><table class="t"><thead><tr>
    <th>kind</th><th>endpoint</th><th>used by</th></tr></thead><tbody>
    ${ents.map(e=>{
      const ep = e.endpoint||{};
      const where = [ep.system, ep.server, ep.database, ep.schema, ep.object, ep.path].filter(Boolean).join(" / ");
      const use = (e.usage||[]).slice(0,4).map(u=>`${esc(u.job||"")} / ${esc(u.step||"")} <span class="mut">(${esc(u.operation||"")})</span>`).join("<br>");
      return `<tr><td><span class="badge b-info">${esc(e.kind)}</span></td>
        <td><span class="ref">${esc(where)}</span></td>
        <td>${use}${(e.usage||[]).length>4?`<br><span class="mut">+${e.usage.length-4} more</span>`:""}</td></tr>`;
    }).join("")}</tbody></table></div>`
  : `<div class="empty"><b>No objects referenced.</b></div>`}`;
}

/* ============================================================ boot */
const RENDER = {overview:secOverview, jobs:secJobs, job:secJob, processing:secProcessing,
                schedules:secSchedules, issues:secIssues, coverage:secCoverage, jobmeta:secJobMeta};
buildNav();
openSection("overview");
</script>
</body>
