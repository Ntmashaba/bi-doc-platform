[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bi-doc-engines"
dynamic = ["version"]
description = "Adapters from pbi-doc-gen and adf-doc-gen to BI Documentation Platform envelope-v1 artifacts."
requires-python = ">=3.11"
# bi-doc-contracts is a local package: install it from packages/contracts first
# (requirements.txt does). It is not listed here so pip never looks it up on PyPI.
dependencies = [
    # Pinned engine revisions; see docs/PROGRESS.md for the recorded versions.
    "pbi-doc-gen @ git+https://github.com/Ntmashaba/pbi-doc-gen@0b04cf41d1cff0e4d7fc3587fff6e14f86fd405f",
    "adf-doc-gen @ git+https://github.com/Ntmashaba/adf-doc-gen@960b4bc165efff415d1adb4932fb39196fc9eff1",
]

[tool.setuptools]
packages = ["bidoc_engines"]

[tool.setuptools.dynamic]
version = { attr = "bidoc_engines.__version__" }
