[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bi-doc-engines"
dynamic = ["version"]
description = "Adapters from pbi-doc-gen and adf-doc-gen to BI Documentation Platform envelope-v1 artifacts."
requires-python = ">=3.11"
# bi-doc-contracts is a local package: install it from packages/contracts first
# (requirements.txt does). Engine packages are also installed from components/.
dependencies = ["pbi-doc-gen[portable]", "adf-doc-gen"]

[tool.setuptools]
packages = ["bidoc_engines"]

[tool.setuptools.dynamic]
version = { attr = "bidoc_engines.__version__" }
