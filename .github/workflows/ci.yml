name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install contracts package with dev extras
        run: python -m pip install -e "packages/contracts[dev]"
      - name: Fixtures are up to date
        run: python packages/contracts/tests/build_fixtures.py --check
      - name: Contract tests (no skips allowed)
        working-directory: packages/contracts
        shell: bash  # implies -o pipefail, so a failing suite fails the step
        run: |
          python -m unittest discover -s tests -v 2>&1 | tee test.log
          if grep -q "skipped" test.log; then echo "::error::tests were skipped"; exit 1; fi
