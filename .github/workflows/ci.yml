name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install monorepo packages
        run: python -m pip install -r requirements.txt
      - name: Fixtures are up to date
        run: python packages/contracts/tests/build_fixtures.py --check
      - name: Unit and end-to-end tests (no skips allowed)
        shell: bash  # implies -o pipefail, so a failing suite fails the step
        run: |
          for suite in components/power-bi components/adf packages/contracts packages/engines packages/relationships apps/generator apps/library; do
            (cd "$suite" && python -m unittest discover -s tests -v) 2>&1 | tee -a test.log
          done
          if grep -Eq '\.\.\. skipped|\(.*skipped=' test.log; then echo "::error::tests were skipped"; exit 1; fi

  portable-samples:
    # Public inputs, pinned by checksum (samples/manifest.json): 24 generated documents checked against explicit
    # questions, then opened in Chromium. The downloads are cached by manifest hash so a network hiccup only
    # matters the first time a manifest changes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: samples/downloads
          key: public-samples-${{ hashFiles('samples/manifest.json') }}
      - run: python scripts/acceptance.py
      - run: npm ci
        working-directory: apps/library/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: apps/library/frontend
      - run: NODE_PATH="$PWD/apps/library/frontend/node_modules" node scripts/check_sample_html.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-sample-documentation
          path: samples/output/

  large-documents:
    # A41: import, memory, search and relationship rebuild with large documents; server
    # search must return exactly what the browser search returns.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python apps/library/tests/check_large_documents.py --json "$RUNNER_TEMP/a41.json"

  azure-template:
    # B13: the Container Apps template compiles, lints clean, keeps the pilot limits and
    # sets only configuration the library accepts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Bicep 0.47.16 (checksum pinned)
        run: |
          curl -sSLo "$RUNNER_TEMP/bicep" https://github.com/Azure/bicep/releases/download/v0.47.16/bicep-linux-x64
          echo "64c345a58e0c3e48b1bc98a4e62d6b3adb1d238281297de3400aeafb2697aa5a  $RUNNER_TEMP/bicep" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bicep"
      - run: python -m pip install -r requirements.txt
      - run: python deploy/azure/check_template.py "$RUNNER_TEMP/bicep"

  real-pbix-samples:
    # 29 real reports pre-extracted by pbi-tools (MIT, Microsoft samples): valid artifacts,
    # no query code in shared output, DAX and source locations kept.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pbi-tools/pbix-samples
          ref: 84a442248b7259de7f5dbac0e25f0c33e3c9fd6a
          path: pbix-samples
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python packages/engines/tests/check_real_pbix_samples.py pbix-samples "$RUNNER_TEMP/real-pbix-output"
      - name: A01 on real reports (publish, search a measure, open it)
        run: python apps/library/tests/check_real_library.py pbix-samples

  adf-templates:
    # Every template in Microsoft's Azure-DataFactory repository (real ARM exports).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Azure/Azure-DataFactory
          ref: ce4c9cab41e5e4fa66f4bddd042cab649c36a4ca
          path: adf-templates
          sparse-checkout: templates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python packages/engines/tests/check_adf_templates.py adf-templates "$RUNNER_TEMP/adf-template-output"

  frontend:
    # TypeScript must compile to exactly the committed static files; then a real browser
    # drives the library shell and both engines' viewers (A19, A20, A27).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frontend tools
        working-directory: apps/library/frontend
        run: npm ci
      - name: Compiled output is committed
        working-directory: apps/library/frontend
        run: |
          npx tsc -p tsconfig.json
          npx tsc -p tsconfig.offline.json
          git diff --exit-code -- ../bidoc_library/static ../../generator/bidoc_generator/offline_static
      - name: Install Chromium
        working-directory: apps/library/frontend
        run: npx playwright install --with-deps chromium
      - run: python -m pip install -r requirements.txt
      - name: Browser acceptance
        run: python apps/library/tests/check_browser.py
      - name: Power BI document in Chromium (search, object navigation, exports)
        run: python components/power-bi/tests/check_browser.py
      - name: Generator desktop UI compiles to the committed files
        working-directory: apps/generator/frontend
        run: |
          npm ci
          npx tsc -p tsconfig.json
          git diff --exit-code -- ../bidoc_generator/desktop/static
      - name: Generator desktop UI acceptance
        run: python apps/generator/tests/check_desktop_browser.py
      - name: Portable offline export over file:// (A12, A38)
        run: python apps/generator/tests/check_offline_browser.py

  docker:
    # A03: the library image builds from the lock file, runs as non-root, refuses an
    # unacknowledged local bind, and keeps documents across restart and re-creation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: docker build -t bidoc-library .
      - run: python -m pip install -r requirements.txt
      - name: Container persistence and access checks
        run: python apps/library/tests/check_docker.py bidoc-library
      - name: Desktop publishing through a TLS ingress (A36)
        run: python apps/library/tests/check_ingress.py

  generator-windows:
    # B08 on Windows: batch queue, PBIX extraction through a child process, and cancellation
    # that ends the whole process tree with taskkill /T (a stand-in replaces pbi-tools; real
    # PBIX extraction with Power BI Desktop is the owner-run W2 check).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Generator tests
        working-directory: apps/generator
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser driver
        working-directory: apps/library/frontend
        run: npm ci
      - name: Portable offline export in Microsoft Edge over file:// (A12)
        run: python apps/generator/tests/check_offline_browser.py --channel msedge

  windows-installer:
    # B09 / A13: frozen executables and the Inno Setup installer, then install, diagnose,
    # generate, serve the desktop app, upgrade (0.2.0 -> 0.2.1) and uninstall from a shell
    # with no Python on PATH. The runner has Python on disk, so this is not the clean-machine
    # run; that is the same script on a clean Windows machine (docs/b09/VERIFICATION.md).
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build 0.2.0
        shell: pwsh
        run: |
          ./packaging/windows/build.ps1 -Version 0.2.0 -BuildLabel "CI build (unsigned)"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/old" | Out-Null
          Copy-Item dist/installer/*.exe "$env:RUNNER_TEMP/old/"
      - name: Build 0.2.1 (upgrade target)
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Version 0.2.1 -BuildLabel "CI build (unsigned)" -SkipInstall
      - name: Fetch the pinned public ABF sample (Microsoft AdventureWorks, MIT; 2 MB, not committed)
        shell: pwsh
        run: |
          $id = "adventure-works-tabular-model-1200-full-database-backup"
          python scripts/fetch_samples.py $id
          $item = (Get-Content samples/manifest.json -Raw | ConvertFrom-Json) | Where-Object { $_.id -eq $id }
          "ABF_ARCHIVE=samples/downloads/$($item.file)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "ABF_SHA256=$($item.sha256)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Install, use, upgrade and uninstall
        shell: pwsh
        run: >
          ./packaging/windows/verify-install.ps1
          -Installer "$env:RUNNER_TEMP/old/bidoc-setup-0.2.0-unsigned.exe"
          -UpgradeInstaller dist/installer/bidoc-setup-0.2.1-unsigned.exe
          -AbfArchive "$env:ABF_ARCHIVE" -AbfSha256 "$env:ABF_SHA256"
          -Report dist/verify-report.json
      - name: Publish both installers with their checksums
        # The 0.2.1 build deletes dist/, so the 0.2.0 installer (the one that was installed, then upgraded) lives only in
        # RUNNER_TEMP. Copy it next to the upgrade installer and list both in SHA256SUMS.txt so a reviewer can fetch the
        # exact pair the verification used.
        if: always()
        shell: pwsh
        run: |
          $old = Get-ChildItem "$env:RUNNER_TEMP/old/*.exe" -ErrorAction SilentlyContinue
          if ($old) { Copy-Item $old dist/installer/ }
          Get-ChildItem dist/installer/*.exe | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bidoc-windows-installer
          path: |
            dist/installer/*.exe
            dist/release.json
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.md
            dist/verify-report.json
          retention-days: 14

  azurite:
    # B10: the Azure backend through the real SDKs against Azurite (the storage emulator):
    # the store contract suite, Table/Blob semantics the design relies on, the
    # competing-replicas crash test, and every API-level suite served from Azure storage.
    # Not live Azure; A15 is a separate, authorized run.
    runs-on: ubuntu-latest
    env:
      BIDOC_AZURE_TEST_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;TableEndpoint=http://127.0.0.1:10002/devstoreaccount1;"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start Azurite
        run: |
          docker run -d --name azurite -p 127.0.0.1:10000:10000 -p 127.0.0.1:10002:10002 \
            mcr.microsoft.com/azure-storage/azurite@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5 \
            azurite --blobHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --loose
      - run: python -m pip install -r requirements.txt
      - name: Store contract, semantics and stress tests against Azurite
        working-directory: apps/library
        shell: bash  # implies -o pipefail, so a failing suite fails the step
        run: |
          python -m unittest discover -s tests -p test_store.py -v 2>&1 | tee azurite.log
          python -m unittest discover -s tests -p test_azure_backend.py -v 2>&1 | tee -a azurite.log
          for suite in test_api test_derived test_metadata test_legacy_import test_zip_import test_publishing test_backup test_personal_paths_import test_jobs; do
            python -m unittest discover -s tests -p "$suite.py" -v 2>&1 | tee -a azurite.log
          done
          grep -q "Azurite" azurite.log || { echo "::error::Azurite tests did not run"; exit 1; }
          if grep -q "skipped" azurite.log; then echo "::error::tests were skipped"; exit 1; fi
      - name: Storage operations per action
        run: python apps/library/tests/measure_azure_ops.py
