# W1 feasibility probe (ADR 0001 §3): confirms a Windows runner is available and that a
# PyInstaller + pywebview executable builds and runs there. It does NOT test PBIX extraction (W2).
name: W1 Windows packaging probe

on:
  workflow_dispatch:
  push:
    paths:
      - spikes/w1/**
      - .github/workflows/w1-windows-packaging-probe.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Record runner
        shell: pwsh
        run: |
          python --version
          [System.Environment]::OSVersion.VersionString
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty pv
      - name: Install build tools
        run: python -m pip install pyinstaller pywebview
      - name: Build
        working-directory: spikes/w1
        run: pyinstaller --noconfirm --onedir --name w1probe --add-data "hello.html;." hello_app.py
      - name: Smoke-run the executable
        working-directory: spikes/w1
        shell: pwsh
        run: |
          $out = & .\dist\w1probe\w1probe.exe --smoke
          $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($out | ConvertFrom-Json).frozen) { throw "not frozen" }
      - uses: actions/upload-artifact@v4
        with:
          name: w1probe-windows-x64
          path: spikes/w1/dist/w1probe
          retention-days: 7
