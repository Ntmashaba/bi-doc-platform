[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bi-doc-library"
dynamic = ["version"]
description = "BI Documentation Platform shared library: catalogue, immutable revisions, publication."
requires-python = ">=3.11"
# Local packages bi-doc-contracts and bi-doc-engines are installed first (requirements.txt).
# Exact versions of these and their transitive dependencies are locked in requirements-lock.txt.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = ["httpx2==2.13.1"]
# Azure Table Storage catalogue and Blob artifacts (B10).
azure = ["azure-data-tables==12.7.0", "azure-storage-blob==12.30.3", "azure-identity==1.25.3"]

[tool.setuptools]
packages = ["bidoc_library", "bidoc_library.azure"]

[tool.setuptools.package-data]
bidoc_library = ["static/*"]

[tool.setuptools.dynamic]
version = { attr = "bidoc_library.__version__" }
